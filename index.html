<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10130f">
  <title>貪食蛇 — 一口一口，刷新紀錄</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
    :root{color-scheme:dark;--bg:#10130f;--panel:#191d18;--line:#30372d;--muted:#879080;--lime:#c5f36a;--cream:#f1f1df;--red:#ff756b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#283121 0%,var(--bg) 52%);color:var(--cream);font-family:'Space Grotesk',sans-serif;display:flex;justify-content:center;align-items:center;padding:34px 22px}
    button{font:inherit;color:inherit}.app{width:min(100%,1080px)}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;letter-spacing:.06em}.brand-mark{width:34px;height:34px;border:1px solid #536046;border-radius:10px;display:grid;place-items:center;color:var(--lime);font-size:20px}.top-note{color:var(--muted);font:11px 'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px;align-items:stretch}.intro,.game-card{border:1px solid var(--line);background:linear-gradient(145deg,#1c211a,#171a16);border-radius:20px}.intro{padding:28px;display:flex;flex-direction:column;justify-content:space-between;min-height:580px;overflow:hidden;position:relative}.intro:after{content:'蛇';position:absolute;font-size:210px;font-weight:700;line-height:1;color:#252d20;right:-34px;top:112px;opacity:.58;pointer-events:none}.eyebrow{color:var(--lime);font:11px 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase}.intro h1{font-size:42px;line-height:1.06;letter-spacing:-.06em;margin:22px 0 14px;position:relative;z-index:1}.intro h1 span{color:var(--lime)}.intro p{color:#a2a99a;font-size:14px;line-height:1.8;max-width:230px;position:relative;z-index:1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px;position:relative;z-index:1}.stat{padding:14px;border:1px solid #343c30;background:#171b15;border-radius:12px}.stat-label{font:10px 'DM Mono',monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.stat-value{margin-top:7px;font-size:27px;font-weight:600;letter-spacing:-.04em}.stat-value small{font-size:12px;color:var(--muted);font-weight:400}.tips{border-top:1px solid var(--line);padding-top:18px;margin-top:28px;color:var(--muted);font-size:12px;line-height:1.9}.key{font:10px 'DM Mono',monospace;color:#dfe6d1;border:1px solid #424a3c;background:#242a20;border-radius:4px;padding:2px 5px;margin:0 2px}.game-card{padding:15px;display:flex;flex-direction:column;min-width:0}.game-head{display:flex;align-items:center;justify-content:space-between;padding:3px 3px 14px}.game-title{font-size:13px;font-weight:600;letter-spacing:.02em}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font:10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.1em}.dot{width:7px;height:7px;background:#69715f;border-radius:50%}.status.playing .dot{background:var(--lime);box-shadow:0 0 10px #c5f36a88}.status.dead .dot{background:var(--red)}.board-wrap{position:relative;flex:1;min-height:320px;background:#11150f;border:1px solid #30372c;border-radius:13px;overflow:hidden;display:grid;place-items:center}.board-wrap:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:25px 25px;pointer-events:none}canvas{width:100%;height:100%;display:block;position:absolute;inset:0}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#10130f88;backdrop-filter:blur(3px);z-index:2;transition:opacity .18s}.overlay.hidden{opacity:0;pointer-events:none}.overlay-box{text-align:center;padding:24px}.overlay-icon{font-size:30px;color:var(--lime);margin-bottom:8px}.overlay h2{font-size:23px;letter-spacing:-.04em;margin:0 0 8px}.overlay p{color:#a2a99a;font-size:12px;margin:0 0 19px}.primary{border:0;background:var(--lime);color:#18200f;font-size:12px;font-weight:700;padding:11px 20px;border-radius:8px;cursor:pointer;transition:transform .15s,background .15s}.primary:hover{background:#d5ff80;transform:translateY(-1px)}.game-controls{display:flex;justify-content:space-between;align-items:center;padding:13px 2px 0;gap:10px}.control-hint{font:10px 'DM Mono',monospace;color:var(--muted)}.actions{display:flex;gap:8px}.secondary{border:1px solid #41493b;background:#20251e;color:#dce2d4;border-radius:8px;padding:9px 12px;font-size:11px;cursor:pointer}.secondary:hover{border-color:#788568}.touch-controls{display:none}.footer{display:flex;justify-content:space-between;color:#66705e;font:10px 'DM Mono',monospace;margin-top:14px;padding:0 4px;letter-spacing:.08em}
    @media(max-width:760px){body{padding:18px 13px;align-items:flex-start}.topbar{margin-bottom:14px}.top-note{display:none}.layout{grid-template-columns:1fr;gap:12px}.intro{min-height:0;padding:20px 21px;display:block}.intro:after{font-size:130px;right:8px;top:8px}.intro h1{font-size:32px;margin:13px 0 8px}.intro p{font-size:12px;margin:0;max-width:70%}.stats{margin-top:15px}.stat{padding:10px 12px}.stat-value{font-size:21px}.tips{display:none}.game-card{padding:10px}.board-wrap{height:min(58vh,480px);min-height:280px;flex:none}.game-controls{padding-top:10px}.control-hint{display:none}.touch-controls{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,34px);gap:4px;margin:12px auto 2px}.touch-controls button{border:1px solid #424a3c;background:#22281f;border-radius:8px;color:var(--lime);font-size:15px;touch-action:manipulation}.touch-controls button:active{background:#38442a}.touch-controls .up{grid-column:2}.touch-controls .left{grid-column:1;grid-row:2}.touch-controls .down{grid-column:2;grid-row:2}.touch-controls .right{grid-column:3;grid-row:2}.footer{margin-top:10px}}
    @media(max-width:380px){.intro h1{font-size:28px}.intro p{max-width:66%}.actions .secondary{padding:8px 9px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><div class="brand-mark">↗</div><span>G R O W</span></div><div class="top-note">A tiny game for your big break</div></header>
    <div class="layout">
      <aside class="intro">
        <div><div class="eyebrow">✳&nbsp; The classic, reimagined</div><h1>再一口，<br><span>就收手。</span></h1><p>吃下果實，讓蛇蛇長大。小心別撞到自己，看看你能長到多長。</p>
          <div class="stats"><div class="stat"><div class="stat-label">本局分數</div><div class="stat-value" id="score">00</div></div><div class="stat"><div class="stat-label">最高紀錄</div><div class="stat-value" id="best">00</div></div></div>
        </div>
        <div class="tips">使用 <span class="key">方向鍵</span> 或 <span class="key">W A S D</span> 移動<br><span class="key">空白鍵</span> 暫停　·　吃一顆果實 +10 分</div>
      </aside>
      <section class="game-card" aria-label="貪食蛇遊戲">
        <div class="game-head"><div class="game-title">果園 — 第 01 關</div><div class="status" id="status"><span class="dot"></span><span id="statusText">準備開始</span></div></div>
        <div class="board-wrap"><canvas id="board" aria-label="貪食蛇遊戲畫面"></canvas><div class="overlay" id="overlay"><div class="overlay-box"><div class="overlay-icon">✳</div><h2 id="overlayTitle">準備好了嗎？</h2><p id="overlayText">吃得越多，長得越長。</p><button class="primary" id="startBtn">開始遊戲&nbsp; →</button></div></div></div>
        <div class="game-controls"><div class="control-hint">方向鍵 / WASD 移動&nbsp;&nbsp; · &nbsp;&nbsp;空白鍵 暫停</div><div class="actions"><button class="secondary" id="pauseBtn">Ⅱ 暫停</button><button class="secondary" id="restartBtn">↻ 重來</button></div></div>
        <div class="touch-controls" aria-label="觸控方向控制"><button class="up" data-dir="up" aria-label="上">↑</button><button class="left" data-dir="left" aria-label="左">←</button><button class="down" data-dir="down" aria-label="下">↓</button><button class="right" data-dir="right" aria-label="右">→</button></div>
      </section>
    </div>
    <footer class="footer"><span>TAKE IT SLOW, GROW SOME MORE.</span><span>✳&nbsp; MADE FOR YOUR BREAK</span></footer>
  </main>
  <script>
    (()=>{
      const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),wrap=canvas.parentElement;
      const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),status=document.getElementById('status'),statusText=document.getElementById('statusText'),overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlayTitle'),overlayText=document.getElementById('overlayText'),startBtn=document.getElementById('startBtn');
      const COLS=24,ROWS=18;let cell=20,snake=[],food={x:15,y:8},dir={x:1,y:0},nextDir={x:1,y:0},score=0,best=Number(localStorage.getItem('growSnakeBest')||0),timer=null,state='ready';
      bestEl.textContent=String(best).padStart(2,'0');
      function resize(){const r=wrap.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cell=Math.min(r.width/COLS,r.height/ROWS);draw()}
      function placeFood(){let p;do{p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p}
      function reset(){clearInterval(timer);score=0;scoreEl.textContent='00';snake=[{x:7,y:9},{x:6,y:9},{x:5,y:9},{x:4,y:9}];dir={x:1,y:0};nextDir={x:1,y:0};placeFood();state='ready';setStatus('準備開始','');showOverlay('準備好了嗎？','吃得越多，長得越長。','開始遊戲  →');draw()}
      function begin(){if(state==='dead')reset();state='playing';hideOverlay();setStatus('進行中','playing');clearInterval(timer);timer=setInterval(tick,125);draw()}
      function pause(){if(state==='playing'){clearInterval(timer);state='paused';setStatus('已暫停','');showOverlay('休息一下','按空白鍵或下方按鈕繼續。','繼續遊戲  →')}else if(state==='paused')begin()}
      function end(){clearInterval(timer);state='dead';setStatus('遊戲結束','dead');if(score>best){best=score;localStorage.setItem('growSnakeBest',best);bestEl.textContent=String(best).padStart(2,'0')}showOverlay('哎呀，撞到了！',`本局獲得 ${score} 分，再來挑戰一次吧。`,'再玩一次  ↻')}
      function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS||snake.some((s,i)=>i<snake.length-1&&s.x===head.x&&s.y===head.y)){end();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=String(score).padStart(2,'0');placeFood()}else snake.pop();draw()}
      function draw(){const w=canvas.width/(Math.min(devicePixelRatio||1,2)),h=canvas.height/(Math.min(devicePixelRatio||1,2));ctx.clearRect(0,0,w,h);const ox=(w-COLS*cell)/2,oy=(h-ROWS*cell)/2;ctx.save();ctx.translate(ox,oy);
        // Subtle board grid
        ctx.strokeStyle='rgba(207,226,182,.045)';ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,ROWS*cell);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*cell);ctx.lineTo(COLS*cell,y*cell);ctx.stroke()}
        // fruit
        const fx=(food.x+.5)*cell,fy=(food.y+.5)*cell;ctx.fillStyle='rgba(255,117,107,.18)';ctx.beginPath();ctx.arc(fx,fy,cell*.42,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff756b';ctx.beginPath();ctx.arc(fx,fy,cell*.22,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#c5f36a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(fx,fy-cell*.19);ctx.quadraticCurveTo(fx+cell*.04,fy-cell*.36,fx+cell*.17,fy-cell*.29);ctx.stroke();
        // snake blocks, with rounded joins
        snake.forEach((s,i)=>{const pad=i===0?cell*.08:cell*.13,x=s.x*cell+pad,y=s.y*cell+pad,sz=cell-pad*2,r=cell*.25;ctx.fillStyle=i===0?'#d8ff8e':`hsl(${82-i*1.2}deg ${72-i*.25}% ${67-i*.75}%)`;ctx.shadowColor=i===0?'#c5f36a66':'transparent';ctx.shadowBlur=i===0?12:0;ctx.beginPath();ctx.roundRect(x,y,sz,sz,r);ctx.fill();ctx.shadowBlur=0;if(i===0){const ex=x+sz/2+dir.x*sz*.16-dir.y*sz*.2,ey=y+sz/2+dir.y*sz*.16+dir.x*sz*.2;for(const sign of [-1,1]){ctx.fillStyle='#26351a';ctx.beginPath();ctx.arc(ex+(-dir.y*sz*.2*sign),ey+(dir.x*sz*.2*sign),Math.max(1.4,cell*.055),0,Math.PI*2);ctx.fill()}}});ctx.restore()}
      function setStatus(t,c){statusText.textContent=t;status.className='status '+c}function showOverlay(t,p,b){overlayTitle.textContent=t;overlayText.textContent=p;startBtn.textContent=b;overlay.classList.remove('hidden')}function hideOverlay(){overlay.classList.add('hidden')}
      function change(d){if(state!=='playing')return;if(d.x===-dir.x&&d.y===-dir.y)return;nextDir=d}
      document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),map={arrowup:{x:0,y:-1},w:{x:0,y:-1},arrowdown:{x:0,y:1},s:{x:0,y:1},arrowleft:{x:-1,y:0},a:{x:-1,y:0},arrowright:{x:1,y:0},d:{x:1,y:0}};if(map[k]){e.preventDefault();if(state==='ready')begin();change(map[k])}else if(k===' '){e.preventDefault();if(state==='ready')begin();else pause()}else if(k==='enter'&&(state==='ready'||state==='dead'))begin()});
      startBtn.addEventListener('click',()=>state==='paused'?begin():begin());document.getElementById('pauseBtn').addEventListener('click',()=>state==='ready'?begin():pause());document.getElementById('restartBtn').addEventListener('click',()=>{reset();begin()});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};if(state==='ready')begin();change(m[b.dataset.dir])}));
      let touchX=0,touchY=0;wrap.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});wrap.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))change({x:Math.sign(dx),y:0});else change({x:0,y:Math.sign(dy)})},{passive:true});
      new ResizeObserver(resize).observe(wrap);window.addEventListener('resize',resize);reset();resize();
    })();
  </script>
</body>
</html>
